<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BookMyTable | Confirm Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-red">book</span>my<span class="brand-red">table</span>
        </div>
        <div class="search-panel">
          <div class="search-input">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C8.01 14 6 11.99 6 9.5S8.01 5 10.5 5 15 7.01 15 9.5 12.99 14 10.5 14z"/></svg>
            <input type="text" placeholder="Search Restaurants" />
          </div>
          <button class="search-button">Search</button>
        </div>
        <div class="top-actions">
          <button class="location">Bengaluru <span>▾</span></button>
          <button class="sign-in">Sign in</button>
          <button class="menu-toggle" aria-label="Menu">☰</button>
        </div>
      </header>

      <div class="app-layout">
        <nav class="main-nav side-nav">
          <a href="index.html">Live Availability</a>
          <a href="restaurants.html">All Restaurants</a>
          <a href="booking.html" class="nav-special active">Confirm Booking</a>
        </nav>

        <main class="page-content booking-page">
        <section class="booking-panel">


          <div class="booking-card">
            <div class="booking-field">
              <label>Restaurant</label>
              <div id="restaurant-name" class="booking-value">Loading...</div>
            </div>
            <div class="booking-field">
              <label>Floor</label>
              <div id="restaurant-floor" class="booking-value">Any available floor</div>
            </div>
            <div class="booking-field">
              <label>Seats available</label>
              <div id="restaurant-max" class="booking-value">0</div>
            </div>
            <div class="booking-field">
              <label for="guest-name">Your name</label>
              <input id="guest-name" type="text" placeholder="Full name" required />
            </div>
            <div class="booking-field">
              <label for="guest-email">Email</label>
              <input id="guest-email" type="email" placeholder="you@example.com" required />
            </div>
            <div class="booking-field">
              <label for="booking-date">Date</label>
              <input id="booking-date" type="date" required />
            </div>
            <div class="booking-field">
              <label for="seat-count">How many seats?</label>
              <input id="seat-count" type="number" min="1" value="1" />
            </div>
            <div id="booking-error" class="booking-error hidden"></div>
            <div class="booking-actions">
              <button id="confirm-booking" class="book-button">Confirm booking</button>
              <a href="restaurants.html" class="cancel-link">Back to restaurants</a>
            </div>
          </div>

          <div id="booking-success" class="booking-success hidden">
            <h2>Booking confirmed</h2>
            <p id="success-message">Your table has been reserved.</p>
            <a href="index.html" class="search-button">Back to live availability</a>
          </div>
        </section>
        </main>
      </div>
    </div>
    <script src="booking.js"></script>
  </body>
</html>
